[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "callingfans-scraper"
version = "0.1.0"
description = "Archivia i contenuti dei tuoi abbonamenti CallingFans (ispirato a of-scraper)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
callingfans-scraper = "callingfans_scraper.cli:main"

[tool.setuptools.packages.find]
include = ["callingfans_scraper*"]
